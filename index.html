<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>💰 간단 가계부</h1>
    <div class="month-nav">
      <button id="prevMonth" class="icon-btn" aria-label="이전 달">‹</button>
      <span id="currentMonth" class="current-month"></span>
      <button id="nextMonth" class="icon-btn" aria-label="다음 달">›</button>
    </div>
  </header>

  <section class="summary">
    <div class="summary-card income">
      <span class="label">수입</span>
      <span class="value" id="totalIncome">0원</span>
    </div>
    <div class="summary-card expense">
      <span class="label">지출</span>
      <span class="value" id="totalExpense">0원</span>
    </div>
    <div class="summary-card balance">
      <span class="label">잔액</span>
      <span class="value" id="totalBalance">0원</span>
    </div>
  </section>

  <section class="budget-section">
    <div class="budget-header">
      <h2 id="budgetTitle">이번 달 예산</h2>
      <span id="budgetBadge" class="budget-badge" hidden></span>
    </div>
    <form id="budgetForm" class="budget-form">
      <input type="number" id="budgetInput" class="budget-input" placeholder="지출 예산 입력" min="0" step="1" inputmode="numeric">
      <button type="submit" class="budget-save-btn">설정</button>
    </form>
    <div class="budget-progress" id="budgetProgress" hidden>
      <div class="budget-stats-row">
        <span class="budget-amounts"><b id="budgetUsed">0원</b> / <span id="budgetTotal">0원</span></span>
        <span class="budget-percent" id="budgetPercent">0%</span>
      </div>
      <div class="budget-bar-track">
        <div class="budget-bar-fill" id="budgetBarFill"></div>
      </div>
    </div>
  </section>

  <section class="form-section">
    <form id="txForm">
      <div class="form-row">
        <input type="date" id="date" required>
        <div class="type-toggle">
          <button type="button" class="type-btn expense-btn active" data-type="expense">지출</button>
          <button type="button" class="type-btn income-btn" data-type="income">수입</button>
        </div>
      </div>
      <div class="form-row">
        <select id="category" required></select>
        <input type="number" id="amount" placeholder="금액" min="0" step="1" required inputmode="numeric">
      </div>
      <div class="form-row">
        <input type="text" id="memo" placeholder="메모 (선택)" maxlength="60">
        <button type="submit" class="add-btn">추가</button>
      </div>
    </form>
  </section>

  <section class="list-section">
    <div class="list-header">
      <h2>내역</h2>
      <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="income">수입</button>
        <button class="filter-btn" data-filter="expense">지출</button>
      </div>
    </div>
    <ul id="txList" class="tx-list"></ul>
    <p id="emptyMsg" class="empty-msg">등록된 내역이 없습니다.</p>
  </section>
</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
